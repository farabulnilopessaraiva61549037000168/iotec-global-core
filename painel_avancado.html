<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IOTEC CORE</title>

<style>
body {
    margin:0;
    background: radial-gradient(circle at center, #0a0a0a, #000);
    color: #0ff;
    font-family: Arial;
}

/* TOPO */
.topbar {
    padding:15px;
    text-align:center;
    border-bottom:1px solid #0ff3;
}

/* LIVROS */
.livros {
    display:flex;
    justify-content:space-around;
    padding:20px;
}

.livro {
    padding:20px;
    border:1px solid #0ff3;
    cursor:pointer;
    transition:0.3s;
}

.livro:hover {
    background:#0ff1;
}

/* CAMADA */
.camadas {
    padding:20px;
}

/* CHAT */
.chat {
    position:fixed;
    bottom:0;
    width:100%;
    background:#000;
    border-top:1px solid #0ff3;
}

.chat input {
    width:80%;
    padding:10px;
    background:#000;
    color:#0ff;
    border:none;
}

.chat button {
    padding:10px;
    background:#0ff;
    color:#000;
    border:none;
}
</style>
</head>

<body>

<div class="topbar">
    <h2>IOTEC CORE SYSTEM</h2>
</div>

<div class="livros">
    <div class="livro" onclick="abrir('financeiro')">Financeiro</div>
    <div class="livro" onclick="abrir('pedidos')">Pedidos</div>
    <div class="livro" onclick="abrir('entregas')">Entregas</div>
    <div class="livro" onclick="abrir('modulos')">Módulos</div>
</div>

<div id="camadas" class="camadas">
    <p>Selecione um livro...</p>
</div>

<div class="chat">
    <input id="entrada" placeholder="Digite um comando..." />
    <button onclick="enviar()">Enviar</button>
</div>

<script>
function abrir(area) {
    let c = document.getElementById("camadas");

    if(area === "financeiro"){
        c.innerHTML = "<h3>Financeiro</h3><p>Registros de pagamento</p>";
    }
    if(area === "pedidos"){
        c.innerHTML = "<h3>Pedidos</h3><p>Pedidos ativos</p>";
    }
    if(area === "entregas"){
        c.innerHTML = "<h3>Entregas</h3><p>Arquivos enviados</p>";
    }
    if(area === "modulos"){
        c.innerHTML = "<h3>Módulos</h3><p>Execuções do núcleo</p>";
    }
}

function enviar(){
    let texto = document.getElementById("entrada").value;

    fetch("http://localhost:5000/comando", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({comando:texto})
    })
    .then(res => res.json())
    .then(data => {
        alert("Resposta: " + data.resposta);
    });
}
</script>

</body>
</html>
