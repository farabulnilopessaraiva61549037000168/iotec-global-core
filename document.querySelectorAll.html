<script>
document.querySelectorAll("a").forEach(link => {

    link.addEventListener("click", function(e) {

        let href = this.getAttribute("href");

        if (!href) return;

        // intercepta padrão real
        if (href.includes("/services/")) {

            e.preventDefault();

            if (href.includes("/1")) {
                abrirPainel("<h1>Auditoria Tecnológica</h1><p>Diagnóstico completo...</p>");
            }

            if (href.includes("/2")) {
                abrirPainel("<h1>Perícia Técnica</h1><p>Laudos técnicos...</p>");
            }

            if (href.includes("/3")) {
                abrirPainel("<h1>Desenvolvimento Sob Medida</h1><p>Sistemas personalizados...</p>");
            }

        }

    });

});
</script>
