<script>
// ==========================================
// CABO UNIVERSAL IOTEC (SUBSTITUI REPLIT)
// ==========================================

document.querySelectorAll("a").forEach(link => {

    link.addEventListener("click", function(e) {

        let href = this.getAttribute("href");

        if (!href) return;

        // BLOQUEIA ROTAS ANTIGAS
        if (href.startsWith("/")) {
            e.preventDefault();

            if (href.includes("/services/1")) {
                abrirPainel("<h1>Auditoria Tecnológica</h1>");
            }

            else if (href.includes("/services/2")) {
                abrirPainel("<h1>Perícia Técnica</h1>");
            }

            else if (href.includes("/services/3")) {
                abrirPainel("<h1>Desenvolvimento Sob Medida</h1>");
            }

            else if (href.includes("/services/4")) {
                abrirPainel("<h1>Segurança da Informação</h1>");
            }

            else if (href.includes("/services/5")) {
                abrirPainel("<h1>Business Intelligence</h1>");
            }

        }

    });

});
</script>
