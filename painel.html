<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel IOTEC</title>

<style>
body { font-family: Arial; background: #111; color: #fff; }

.card {
  border: 1px solid #444;
  padding: 10px;
  margin: 10px;
  cursor: pointer;
  border-radius: 8px;
}

.amarelo { background: #665500; }
.verde { background: #004d00; }
.vermelho { background: #660000; }
.azul { background: #002f66; }

.detalhe {
  display: none;
  margin-top: 10px;
  padding: 10px;
  background: #000;
  border: 1px solid #555;
}
</style>

</head>
<body>

<h1>📡 Painel do Núcleo</h1>

<div id="lista"></div>

<script>
function corStatus(status) {
  if (status === "novo") return "amarelo";
  if (status === "processando") return "azul";
  if (status === "concluido") return "verde";
  if (status === "erro") return "vermelho";
  return "";
}

fetch("eventos.json")
.then(r => r.json())
.then(data => {

  const lista = document.getElementById("lista");

  data.forEach(item => {

    const card = document.createElement("div");
    card.className = "card " + corStatus(item.status);

    card.innerHTML = `
      <b>👤 ${item.cliente}</b><br>
      📦 ${item.produto} — R$ ${item.valor}<br>
      ⚡ Status: ${item.status}

      <div class="detalhe">
        <p><b>Etapa:</b> ${item.etapa}</p>
        <p><b>Histórico:</b></p>
        <ul>
          ${item.historico.map(h => `<li>${h}</li>`).join("")}
        </ul>
      </div>
    `;

    card.onclick = () => {
      const det = card.querySelector(".detalhe");
      det.style.display = det.style.display === "block" ? "none" : "block";
    };

    lista.appendChild(card);
  });

});
</script>

</body>
</html>
