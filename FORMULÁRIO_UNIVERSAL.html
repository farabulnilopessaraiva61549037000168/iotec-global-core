<script>
// ===============================
// FORMULÁRIO UNIVERSAL
// ===============================

function abrirFormularioUniversal() {

    abrirPainel(`
        <h1>Não encontrou seu setor?</h1>
        <p>Preencha abaixo que vamos montar uma solução sob medida:</p>

        <input placeholder="Seu nome" style="width:100%;padding:10px;"><br><br>
        <input placeholder="Empresa / Setor" style="width:100%;padding:10px;"><br><br>

        <textarea placeholder="Descreva sua necessidade"
        style="width:100%;height:100px;"></textarea>

        <br><br>
        <button>Enviar Solicitação</button>
    `);
}

// BOTÃO INTELIGENTE PARA CASO NÃO ENCONTRE
document.querySelectorAll("a, button").forEach(el => {

    el.addEventListener("click", function(e) {

        let texto = (this.innerText || "").toLowerCase();

        if (texto.includes("não encontrou") || texto.includes("manual")) {
            e.preventDefault();
            abrirFormularioUniversal();
        }

    });

});
</script>
