<div style="text-align:center; margin:10px;">
  <button onclick="voltar()">◀ Voltar</button>
  <button onclick="pausar()">⏸ Pausar</button>
  <button onclick="avancar()">▶ Avançar</button>
</div>

<iframe id="frame" width="100%" height="600px"></iframe>

<script>
let telas = ["auditoria.html","automacao.html","dados.html"];
let i = 0;
let rodando = true;
let intervalo;

function carregar() {
  document.getElementById("frame").src = telas[i];
}

function avancar() {
  i = (i + 1) % telas.length;
  carregar();
}

function voltar() {
  i = (i - 1 + telas.length) % telas.length;
  carregar();
}

function pausar() {
  rodando = !rodando;
  if (rodando) iniciar();
  else clearInterval(intervalo);
}

function iniciar() {
  intervalo = setInterval(() => {
    if (rodando) avancar();
  }, 15000);
}

carregar();
iniciar();
</script>
