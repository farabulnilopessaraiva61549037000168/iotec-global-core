<!DOCTYPE html>
<html>
<head>
    <title>IOTEC Platform</title>
    <style>
        body{
            font-family: Arial;
            background:#0f172a;
            color:white;
            text-align:center;
            padding:40px;
        }

        .card{
            background:#1e293b;
            padding:25px;
            border-radius:12px;
            width:600px;
            margin:auto;
        }

        button{
            padding:12px 20px;
            background:#22c55e;
            border:none;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="card">

<h1>{{data.empresa}}</h1>
<p>{{data.status}}</p>

<h2>Capacidades do Núcleo</h2>

<ul>
{% for cap in data.capabilities %}
<li>{{cap}}</li>
{% endfor %}
</ul>

<br>

<a href="/gerar-pdf">
<button>Gerar Relatório Institucional (PDF)</button>
</a>

</div>

</body>
</html>
