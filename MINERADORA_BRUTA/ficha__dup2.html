<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ficha Técnica · REGULUS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <strong>REGULUS IOTEC</strong><br>
          <span class="small">Ficha Técnica Universal</span>
        </div>
      </div>
      <a class="small" href="{{ url_for('recepcao') }}">Voltar à recepção</a>
    </div>

    <section class="hero">
      <h1>Solicite sua solução tecnológica</h1>
      <p>
        Responda abaixo e nossa equipe poderá preparar análise, proposta, protótipo e construção do seu sistema sob medida.
      </p>
    </section>

    <div class="panel">
      <form method="post" action="{{ url_for('enviar_ficha') }}">
        <div class="row2">
          <div>
            <label>Nome completo</label>
            <input name="nome" required>
          </div>
          <div>
            <label>Empresa / organização</label>
            <input name="empresa" required>
          </div>
        </div>

        <div class="row2">
          <div>
            <label>E-mail</label>
            <input name="email" type="email" required>
          </div>
          <div>
            <label>País</label>
            <input name="pais" required>
          </div>
        </div>

        <div class="row2">
          <div>
            <label>Idioma da interface</label>
            <select name="idioma_interface" required>
              <option value="">Selecione</option>
              {% for i in idiomas %}
              <option value="{{ i }}">{{ i }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label>Idioma do projeto / atendimento</label>
            <select name="idioma_projeto" required>
              <option value="">Selecione</option>
              {% for i in idiomas %}
              <option value="{{ i }}">{{ i }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <label>Setor econômico</label>
        <input name="setor" value="{{ setor_preselecionado }}" placeholder="Ex.: Financeiro, Engenharia, Mineração, Hotelaria" required>

        <label>Segmento detalhado</label>
        <input name="segmento" placeholder="Ex.: hospital privado, banco digital, fazenda leiteira">

        <div class="row2">
          <div>
            <label>Tipo de cliente</label>
            <select name="tipo_cliente" required>
              <option value="">Selecione</option>
              {% for t in tipos_cliente %}
              <option value="{{ t }}">{{ t }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label>Urgência</label>
            <select name="urgencia" required>
              <option value="">Selecione</option>
              {% for u in urgencias %}
              <option value="{{ u }}">{{ u }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="row2">
          <div>
            <label>Faixa de orçamento</label>
            <select name="orcamento">
              {% for o in orcamentos %}
              <option value="{{ o }}">{{ o }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label>Nível de solução desejado</label>
            <select name="nivel_solucao" required>
              <option value="">Selecione</option>
              {% for n in niveis %}
              <option value="{{ n }}">{{ n }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <label>Qual o principal problema que você quer resolver?</label>
        <textarea name="problema_principal" required placeholder="Explique o principal problema, gargalo ou dor do seu negócio."></textarea>

        <label>Descreva a necessidade com mais detalhes</label>
        <textarea name="necessidade" required placeholder="Explique o que o sistema precisa fazer, quais rotinas deve atender e como você quer operar."></textarea>

        <label>Integrações / ferramentas que já usa</label>
        <textarea name="integracoes" placeholder="Ex.: planilhas, ERP, CRM, Power BI, sensores, WhatsApp, e-mail, banco de dados."></textarea>

        <label>Observações adicionais</label>
        <textarea name="observacoes" placeholder="Personalização, prazo, visual, regras internas, segurança, acesso, equipes."></textarea>

        <button class="btn" type="submit">Solicitar análise especializada</button>
      </form>
    </div>
  </div>
</body>
</html>
