<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>IOTEC PORTAL</title>

<style>
body {
    margin:0;
    background:#020617;
    color:white;
    font-family:Segoe UI;
}

.header {
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.container {
    display:flex;
}

.menu {
    width:250px;
    padding:20px;
    border-right:1px solid rgba(255,255,255,0.1);
}

.menu button {
    width:100%;
    margin-bottom:10px;
    padding:12px;
    background:#0ea5e9;
    border:none;
    color:white;
    cursor:pointer;
}

.viewer {
    flex:1;
    height:90vh;
}

iframe {
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div class="header">
    <h2>IOTEC PORTAL CENTRAL</h2>
</div>

<div class="container">

<div class="menu">
    <button onclick="abrir('https://SEU_LINK_RENDER')">SHOPPING</button>
    <button onclick="abrir('https://google.com')">TESTE</button>
</div>

<div class="viewer">
    <iframe id="frame"></iframe>
</div>

</div>

<script>
function abrir(url){
    document.getElementById('frame').src = url;
}
</script>

</body>
</html>
