<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>IOTEC TOWER</title>

<style>
body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Segoe UI;
}

.header{
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.grid{
    display:grid;
    grid-template-columns:250px 1fr;
    height:90vh;
}

.menu{
    padding:20px;
    border-right:1px solid rgba(255,255,255,0.1);
}

.menu-item{
    padding:10px;
    margin-bottom:10px;
    background:rgba(255,255,255,0.05);
    cursor:pointer;
}

.menu-item:hover{
    background:rgba(0,212,255,0.2);
}

.panel{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    background:rgba(255,255,255,0.03);
    padding:15px;
    border:1px solid rgba(255,255,255,0.05);
}

.ok{color:#22c55e;}
.warn{color:#facc15;}
.crit{color:#ef4444;}
.info{color:#38bdf8;}
</style>
</head>

<body>

<div class="header">
<h2>?? IOTEC TOWER — COMMAND CENTER</h2>
</div>

<div class="grid">

<div class="menu">
<div class="menu-item">ANDAR 1 — SHOPPING</div>
<div class="menu-item">ANDAR 2 — PAGAMENTOS</div>
<div class="menu-item">ANDAR 3 — PRATELEIRA</div>
<div class="menu-item">ANDAR 4 — FACTORY</div>
</div>

<div class="panel">

<div class="card">
<h4>Status Comercial</h4>
<p class="ok">ATIVO</p>
</div>

<div class="card">
<h4>Fluxo Financeiro</h4>
<p class="warn">MODERADO</p>
</div>

<div class="card">
<h4>Demanda</h4>
<p class="crit">ALTA</p>
</div>

<div class="card">
<h4>Operações</h4>
<p class="info">ESTÁVEL</p>
</div>

</div>

</div>

</body>
</html>
