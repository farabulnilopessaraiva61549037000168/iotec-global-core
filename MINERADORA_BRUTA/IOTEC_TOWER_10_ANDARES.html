<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IOTEC TOWER</title>

<style>

body{
    margin:0;
    font-family:Segoe UI;
    background:#020617;
    color:#e5e7eb;
}

/* FUNDO */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:radial-gradient(circle at 20% 30%, #0ea5e9 0%, transparent 40%),
               radial-gradient(circle at 80% 70%, #22c55e 0%, transparent 40%);
    opacity:0.08;
}

/* HEADER */
.header{
    position:fixed;
    width:100%;
    padding:20px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
}

/* LOGO */
.logo{
    display:flex;
    gap:10px;
    align-items:center;
}

.globe{
    width:18px;
    height:18px;
    border:1px solid #00d4ff;
    border-radius:50%;
    box-shadow:0 0 10px #00d4ff;
}

/* TORRE */
.tower{
    position:absolute;
    left:30px;
    top:100px;
    width:300px;
}

/* ANDARES */
.floor{
    height:70px;
    margin:10px 0;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.1);
    display:flex;
    align-items:center;
    padding-left:20px;
    cursor:pointer;
    transition:0.3s;
}

.floor:hover{
    border-color:#00d4ff;
    box-shadow:0 0 12px rgba(0,212,255,0.3);
}

/* VISUALIZAÇÃO */
.viewer{
    position:absolute;
    right:0;
    top:80px;
    width:70%;
    height:calc(100% - 80px);
    background:#010611;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* TEXTO */
.label{
    font-size:13px;
    letter-spacing:1px;
    color:#94a3b8;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="header">
    <div class="logo">
        <div class="globe"></div>
        <div>IOTEC TOWER</div>
    </div>
</div>

<div class="tower">

<div class="floor" onclick="abrir(1)">01 — PORTAL GLOBAL</div>
<div class="floor" onclick="abrir(2)">02 — COMERCIAL</div>
<div class="floor" onclick="abrir(3)">03 — PRATELEIRA</div>
<div class="floor" onclick="abrir(4)">04 — FACTORY</div>
<div class="floor" onclick="abrir(5)">05 — INTELIGÊNCIA</div>
<div class="floor" onclick="abrir(6)">06 — GOVERNO</div>
<div class="floor" onclick="abrir(7)">07 — SAÚDE</div>
<div class="floor" onclick="abrir(8)">08 — EDUCAÇÃO</div>
<div class="floor" onclick="abrir(9)">09 — AUTOMAÇÃO</div>
<div class="floor" onclick="abrir(10)">10 — LABORATÓRIO</div>

</div>

<div class="viewer">
    <iframe id="frame"></iframe>
</div>

<script>

function abrir(n){

    let urls = {
        1: "COLE_RENDER_SHOPPING",
        2: "COLE_LINK_PAGAMENTO",
        3: "COLE_LINK_PRATELEIRA",
        4: "COLE_LINK_FACTORY",
        5: "COLE_LINK_COPILOT",
        6: "",
        7: "",
        8: "",
        9: "",
        10: ""
    };

    let url = urls[n];

    if(url !== ""){
        document.getElementById("frame").src = url;
    } else {
        alert("Andar ainda não configurado");
    }
}

// inicia no portal principal
abrir(1);

</script>

</body>
</html>
