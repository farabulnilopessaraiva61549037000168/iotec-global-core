<!DOCTYPE html>
<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<title>Portal de Acesso - Núcleo Central</title>
<style>
body{font-family:Arial;background:#0b1c2c;color:white;text-align:center;margin-top:80px;}
.box{background:#12263a;padding:30px;border-radius:10px;display:inline-block;}
input,select,button{padding:10px;margin:5px;border-radius:5px;border:none;}
button{background:#1e90ff;color:white;font-weight:bold;}
</style>
</head>
<body>
<div class="box">
<h2>Primeiro Acesso ao Sistema</h2>
<form method="POST">
<input name="usuario" placeholder="Nome do gerente" required="" value="Farabulini Lopes Saraiva "><br>
<input name="empresa" placeholder="Empresa / Banco" required="" value="Banco"><br>
<select name="setor">
<option value="gerente" selected="selected">Gerência Bancária</option>
<option value="arquitetura">Arquitetura</option>
<option value="pecuaria">Agropecuária</option>
</select><br>
<button type="submit">Entrar no Sistema</button>
</form>
</div>


</body></html>
