<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IoTEC - Sistema Adaptativo</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:#fff;
}

/* HEADER */
.header {
  padding:15px;
  background:#111;
  border-bottom:1px solid #333;
}

.header h1 {
  font-size:18px;
  color:#00ffcc;
}

/* CONFIG */
.config {
  padding:15px;
  background:#151515;
}

/* GRID */
.grid {
  display:flex;
  flex-wrap:wrap;
  padding:10px;
}

.card {
  width:250px;
  margin:10px;
  padding:15px;
  background:#111;
  border:1px solid #333;
  border-radius:8px;
}

/* BOTÃO */
button {
  padding:10px;
  background:#00ffcc;
  border:none;
  cursor:pointer;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="header">
  <h1>IoTEC — Construtora e Distribuidora de Inovações e Tecnologia</h1>
</div>

<div class="config">
  <label>Selecione o setor:</label>
  <select id="setor">
    <option value="engenharia">Engenharia</option>
    <option value="saude">Saúde</option>
    <option value="juridico">Jurídico</option>
    <option value="publico">Gestão Pública</option>
  </select>

  <button onclick="carregar()">Gerar Sistema</button>
</div>

<div class="grid" id="painel"></div>

<script>

function carregar(){

  const setor = document.getElementById("setor").value;
  const painel = document.getElementById("painel");

  painel.innerHTML = "";

  let blocos = [];

  if(setor === "engenharia"){
    blocos = ["Análise Estrutural","Modelagem Técnica","Relatórios de Projeto"];
  }

  if(setor === "saude"){
    blocos = ["Diagnóstico","Laudos Técnicos","Indicadores Clínicos"];
  }

  if(setor === "juridico"){
    blocos = ["Parecer Jurídico","Documentação","Análise de Risco"];
  }

  if(setor === "publico"){
    blocos = ["Compliance","Indicadores Públicos","Relatórios Institucionais"];
  }

  blocos.forEach(b => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<b>${b}</b><br><br>Sistema configurado automaticamente`;
    painel.appendChild(div);
  });

}

</script>

</body>
</html>
