<!-- ENTERPRISE_GATE.html -->

<section class="enterprise-gate">

    <form onsubmit="sendLead(); return false;">

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            id="service"
            placeholder="Service"
            required
        >

        <textarea
            id="message"
            placeholder="Describe your operation"
        ></textarea>

        <button type="submit">
            ENTER ECOSYSTEM
        </button>

    </form>

</section>

<script src="NETLIFY_REAL_BRIDGE.js"></script>
