<script>
document.querySelectorAll("a").forEach(link => {

    link.addEventListener("click", function(e) {

        let href = this.getAttribute("href");

        if (!href) return;

        if (href.includes("/services/")) {

            e.preventDefault();

            if (href.includes("/1")) {
                abrirPainel("<h1>Auditoria Tecnológica</h1><p>Diagnóstico completo da infraestrutura.</p>");
            }

            else if (href.includes("/2")) {
                abrirPainel("<h1>Perícia Técnica Judicial</h1><p>Laudos técnicos especializados.</p>");
            }

            else if (href.includes("/3")) {
                abrirPainel("<h1>Desenvolvimento Sob Medida</h1><p>Sistemas personalizados.</p>");
            }

            else if (href.includes("/4")) {
                abrirPainel("<h1>Segurança da Informação</h1><p>Proteção de dados e sistemas.</p>");
            }

            else if (href.includes("/5")) {
                abrirPainel("<h1>Business Intelligence</h1><p>Análise estratégica de dados.</p>");
            }

        }

    });

});
</script>
