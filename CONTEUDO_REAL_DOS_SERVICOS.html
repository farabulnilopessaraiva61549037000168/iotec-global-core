<script>

function abrirServico(nome) {

    let conteudo = "";

    if (nome.includes("auditoria")) {
        conteudo = `
        <h1>Auditoria Tecnológica</h1>
        <p>Diagnóstico completo da infraestrutura digital.</p>
        <ul>
            <li>Análise de sistemas</li>
            <li>Mapeamento de falhas</li>
            <li>Plano de otimização</li>
        </ul>
        `;
    }

    else if (nome.includes("pericia")) {
        conteudo = `
        <h1>Perícia Técnica Judicial</h1>
        <p>Laudos técnicos para processos judiciais.</p>
        `;
    }

    else if (nome.includes("desenvol")) {
        conteudo = `
        <h1>Desenvolvimento Sob Medida</h1>
        <p>Sistemas personalizados para sua empresa.</p>
        `;
    }

    else if (nome.includes("seguran")) {
        conteudo = `
        <h1>Segurança da Informação</h1>
        <p>Proteção completa de dados e sistemas.</p>
        `;
    }

    else if (nome.includes("dados") || nome.includes("business")) {
        conteudo = `
        <h1>Business Intelligence</h1>
        <p>Análise estratégica de dados.</p>
        `;
    }

    abrirPainel(conteudo);
}

// ATIVA TODOS OS "SAIBA MAIS"
document.querySelectorAll("a, button").forEach(el => {

    el.addEventListener("click", function(e) {

        let texto = (this.innerText || "").toLowerCase();

        if (texto.includes("saiba")) {
            e.preventDefault();
            abrirServico(texto);
        }

    });

});
</script>
